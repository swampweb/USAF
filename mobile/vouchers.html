<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Voucher Packages | Orders & Travel Tracker</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="shortcut icon" href="../favicon.ico">
  <link rel="apple-touch-icon" href="../assets/img/orders-travel-tracker-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="stylesheet" href="assets/css/mobile.css?v=52">
  <style>
    .v52-error { border:1px solid #fecdd3; background:#fff1f3; color:#9f1239; border-radius:18px; padding:14px; font-weight:800; line-height:1.45; }
    .v52-help { border:1px solid #fed7aa; background:#fff7ed; color:#9a3412; border-radius:18px; padding:14px; font-weight:800; line-height:1.45; }
    .v52-check-card { display:grid; grid-template-columns:auto 1fr; align-items:start; gap:10px; }
    .v52-check-card input { min-height:22px; width:22px; margin-top:2px; }
  </style>
</head>
<body data-page="vouchers">
  <div class="mobile-shell">
    <header class="mobile-topbar">
      <button class="menu-button" type="button" id="menuButton" aria-label="Open menu">☰</button>
      <div class="topbar-title">
        <strong>Orders & Travel</strong>
        <span>Voucher Packages</span>
      </div>
      <button class="icon-button" type="button" id="backButton" aria-label="Back">‹</button>
    </header>

    <aside class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
      <div class="drawer-head">
        <strong>Menu</strong>
        <button class="icon-button" type="button" id="closeMenuButton" aria-label="Close menu">×</button>
      </div>
      <nav class="drawer-nav">
        <a href="index.html">Dashboard</a>
        <a href="tours.html">Tours</a>
        <a href="receipts.html">Receipts</a>
        <a href="vouchers.html">Voucher Packages</a>
        <a href="profile.html">My Profile</a>
        <a href="../dashboard.html" id="desktopViewLink">Desktop View</a>
        <button type="button" id="logoutButton">Logout</button>
      </nav>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>

    <main class="mobile-main">
      <section class="mobile-hero">
        <h1>Voucher Packages</h1>
        <p>Create a package by selecting a Tour, then a Cycle, then the receipts tied to that Cycle.</p>
      </section>
      <section id="mobileContent" class="mobile-content">
        <div class="loading-card">Loading Voucher Packages v52...</div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js?v=52"></script>
  <script>
    (function(){
      const content = document.getElementById('mobileContent');
      let client = null;
      let currentUser = null;

      function esc(value){ return String(value ?? '').replace(/[&<>'\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c])); }
      function dt(value){ return value ? new Date(value + 'T00:00:00').toLocaleDateString() : 'Not set'; }
      function money(value){ return Number(value || 0).toLocaleString(undefined,{style:'currency',currency:'USD'}); }
      function showError(title, err){
        console.error(title, err);
        content.innerHTML = '<div class="v52-error"><strong>' + esc(title) + '</strong><br>' + esc(err && err.message ? err.message : err) + '</div>';
      }
      function showLoading(text){ content.innerHTML = '<div class="loading-card">' + esc(text || 'Loading...') + '</div>'; }
      function getClient(){
        if (client) return client;
        if (!window.supabase) throw new Error('Supabase library did not load.');
        if (!window.USAF_CONFIG) throw new Error('USAF config did not load. Check ../assets/js/config.js.');
        client = window.supabase.createClient(window.USAF_CONFIG.SUPABASE_URL, window.USAF_CONFIG.SUPABASE_ANON_KEY, {
          auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
        });
        return client;
      }
      async function requireAuth(){
        const supa = getClient();
        const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Auth session check timed out. Refresh or sign in again.')), 10000));
        const result = await Promise.race([supa.auth.getSession(), timeout]);
        if (!result.data || !result.data.session) {
          window.location.href = '../login.html?returnTo=mobile/vouchers.html';
          return null;
        }
        currentUser = result.data.session.user;
        return currentUser;
      }
      function setupShell(){
        const drawer = document.getElementById('mobileDrawer');
        const backdrop = document.getElementById('drawerBackdrop');
        const open = () => { drawer.classList.add('open'); backdrop.classList.add('open'); };
        const close = () => { drawer.classList.remove('open'); backdrop.classList.remove('open'); };
        document.getElementById('menuButton').addEventListener('click', open);
        document.getElementById('closeMenuButton').addEventListener('click', close);
        backdrop.addEventListener('click', close);
        document.getElementById('backButton').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = 'index.html'; });
        document.getElementById('logoutButton').addEventListener('click', async () => { await getClient().auth.signOut(); location.href = '../login.html'; });
      }
      async function safeSelect(table, select, filters){
        let q = getClient().from(table).select(select);
        (filters || []).forEach(([method, column, value]) => { q = q[method](column, value); });
        return await q;
      }
      async function loadTours(){
        let result = await safeSelect('USAF_tour_summary','*', [['eq','user_id',currentUser.id]]);
        if (result.error) {
          result = await safeSelect('USAF_tours','*', [['eq','user_id',currentUser.id]]);
        }
        if (result.error) throw result.error;
        return (result.data || []).sort((a,b) => String(b.orders_start_date||'').localeCompare(String(a.orders_start_date||'')));
      }
      async function loadCycles(tourId){
        const result = await getClient().from('USAF_cycles').select('*').eq('user_id',currentUser.id).eq('tour_id',tourId).order('start_date',{ascending:false});
        if (result.error) throw result.error;
        return result.data || [];
      }
      async function loadReceiptsForCycle(cycleId){
        let result = await getClient()
          .from('USAF_receipts')
          .select('*,USAF_receipt_types(name)')
          .eq('user_id',currentUser.id)
          .eq('cycle_id',cycleId)
          .eq('is_processed',false)
          .order('receipt_date',{ascending:false});
        if (result.error) {
          result = await getClient()
            .from('USAF_receipts')
            .select('*')
            .eq('user_id',currentUser.id)
            .eq('cycle_id',cycleId)
            .order('receipt_date',{ascending:false});
        }
        if (result.error) throw result.error;
        return result.data || [];
      }
      async function renderHome(){
        showLoading('Loading voucher packages...');
        let historyHtml = '';
        const historyResult = await getClient().from('USAF_vouchers').select('*').eq('user_id',currentUser.id).order('created_at',{ascending:false});
        if (historyResult.error) {
          historyHtml = '<div class="v52-help">Package history could not be loaded: ' + esc(historyResult.error.message) + '</div>';
        } else {
          const rows = historyResult.data || [];
          historyHtml = rows.length ? rows.map(v => '<article class="data-card"><strong>' + dt(v.date_from) + ' - ' + dt(v.date_to) + '</strong><span>' + esc(v.receipt_count || 0) + ' receipts | ' + money(v.total_amount) + '</span><span class="status-pill">' + esc(v.status || 'created') + '</span></article>').join('') : '<div class="empty-card">No voucher packages yet.</div>';
        }
        content.innerHTML = '<div class="toolbar"><strong>Voucher Packages</strong><button class="btn" id="newVoucherBtn">+ Package</button></div><div id="voucherBuilder"></div><div class="section-title">Package History</div><div class="card-list">' + historyHtml + '</div>';
        document.getElementById('newVoucherBtn').addEventListener('click', renderTourStep);
      }
      async function renderTourStep(){
        const wrap = document.getElementById('voucherBuilder');
        wrap.innerHTML = '<div class="loading-card">Loading Tours...</div>';
        const tours = await loadTours();
        wrap.innerHTML = '<section class="form-card"><strong>Create Voucher Package</strong><span class="muted">Step 1: Select the Tour.</span><div class="card-list">' + (tours.length ? tours.map(t => '<article class="data-card"><strong>' + esc(t.tour_name) + '</strong><span>' + esc(t.location || 'No location') + ' | ' + dt(t.orders_start_date) + ' - ' + dt(t.orders_end_date) + '</span><button class="btn secondary" data-tour-id="' + esc(t.id) + '">Use This Tour</button></article>').join('') : '<div class="empty-card">No Tours available. Create a Tour first.</div>') + '</div><button type="button" class="btn secondary full" id="cancelBuild">Cancel</button></section>';
        document.getElementById('cancelBuild').addEventListener('click', () => wrap.innerHTML = '');
        wrap.querySelectorAll('[data-tour-id]').forEach(btn => btn.addEventListener('click', () => renderCycleStep(tours.find(t => t.id === btn.dataset.tourId))));
      }
      async function renderCycleStep(tour){
        const wrap = document.getElementById('voucherBuilder');
        wrap.innerHTML = '<div class="loading-card">Loading Cycles...</div>';
        const cycles = await loadCycles(tour.id);
        wrap.innerHTML = '<section class="form-card"><button type="button" class="back-link" id="backToTours">‹ Back to Tours</button><strong>' + esc(tour.tour_name) + '</strong><span class="muted">Step 2: Select the Cycle for this package.</span><div class="card-list">' + (cycles.length ? cycles.map(c => '<article class="data-card"><strong>' + dt(c.start_date) + ' - ' + dt(c.end_date) + '</strong><span>' + money(c.per_diem_per_day) + ' per day | ' + esc(c.status || 'active') + '</span><button class="btn secondary" data-cycle-id="' + esc(c.id) + '">Use This Cycle</button></article>').join('') : '<div class="empty-card">No Cycles found for this Tour. Add a Cycle from the Tour screen first.</div>') + '</div><button type="button" class="btn secondary full" id="cancelBuild">Cancel</button></section>';
        document.getElementById('backToTours').addEventListener('click', renderTourStep);
        document.getElementById('cancelBuild').addEventListener('click', () => wrap.innerHTML = '');
        wrap.querySelectorAll('[data-cycle-id]').forEach(btn => btn.addEventListener('click', () => renderReceiptStep(tour, cycles.find(c => c.id === btn.dataset.cycleId))));
      }
      async function renderReceiptStep(tour, cycle){
        const wrap = document.getElementById('voucherBuilder');
        wrap.innerHTML = '<div class="loading-card">Loading Receipts...</div>';
        const receipts = await loadReceiptsForCycle(cycle.id);
        const total = receipts.reduce((sum,r) => sum + Number(r.amount || 0), 0);
        wrap.innerHTML = '<section class="form-card"><button type="button" class="back-link" id="backToCycles">‹ Back to Cycles</button><strong>' + esc(tour.tour_name) + '</strong><span class="muted">Step 3: Review receipts for ' + dt(cycle.start_date) + ' - ' + dt(cycle.end_date) + '.</span><article class="data-card"><div class="data-row"><span>Cycle</span><b>' + dt(cycle.start_date) + ' - ' + dt(cycle.end_date) + '</b></div><div class="data-row"><span>Receipts</span><b>' + receipts.length + '</b></div><div class="data-row"><span>Total</span><b>' + money(total) + '</b></div></article><div class="card-list">' + (receipts.length ? receipts.map(r => '<label class="data-card v52-check-card"><input type="checkbox" class="receiptCheck" value="' + esc(r.id) + '" checked><span><strong>' + esc((r.USAF_receipt_types && r.USAF_receipt_types.name) || r.scope || 'Receipt') + ' - ' + money(r.amount) + '</strong><span>' + dt(r.receipt_date) + ' | ' + esc(r.notes || 'No notes') + '</span></span></label>').join('') : '<div class="empty-card">No available receipts for this Cycle. Add receipts to this Cycle first.</div>') + '</div><button class="btn full" id="createPackageBtn" ' + (receipts.length ? '' : 'disabled') + '>Create Package From This Cycle</button><button type="button" class="btn secondary full" id="cancelBuild">Cancel</button></section>';
        document.getElementById('backToCycles').addEventListener('click', () => renderCycleStep(tour));
        document.getElementById('cancelBuild').addEventListener('click', () => wrap.innerHTML = '');
        const createBtn = document.getElementById('createPackageBtn');
        if (createBtn) createBtn.addEventListener('click', () => createPackage(tour, cycle, receipts));
      }
      async function createPackage(tour, cycle, receipts){
        const selectedIds = Array.from(document.querySelectorAll('.receiptCheck:checked')).map(x => x.value);
        const selected = receipts.filter(r => selectedIds.includes(r.id));
        if (!selected.length) { alert('Select at least one receipt.'); return; }
        const total = selected.reduce((sum,r) => sum + Number(r.amount || 0), 0);
        const packageResult = await getClient().from('USAF_vouchers').insert({
          user_id: currentUser.id,
          date_from: cycle.start_date,
          date_to: cycle.end_date,
          status: 'created',
          receipt_count: selected.length,
          total_amount: total
        }).select().single();
        if (packageResult.error) throw packageResult.error;
        const items = selected.map(r => ({ voucher_id: packageResult.data.id, receipt_id: r.id, file_path: r.file_path || null, amount: Number(r.amount || 0) }));
        if (items.length) {
          const itemResult = await getClient().from('USAF_voucher_items').insert(items);
          if (itemResult.error) throw itemResult.error;
        }
        await getClient().from('USAF_receipts').update({ is_processed:true, processed_at:new Date().toISOString(), processed_by:currentUser.id }).in('id', selected.map(r => r.id)).eq('user_id', currentUser.id);
        alert('Voucher package created.');
        await renderHome();
      }
      async function init(){
        try {
          setupShell();
          showLoading('Checking session...');
          await requireAuth();
          if (!currentUser) return;
          await renderHome();
        } catch (err) {
          showError('Mobile Voucher Packages failed to load.', err);
        }
      }
      init();
    })();
  </script>
</body>
</html>
