<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profile | Orders & Travel Tracker</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="shortcut icon" href="../favicon.ico">
  <link rel="apple-touch-icon" href="../assets/img/orders-travel-tracker-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="stylesheet" href="assets/css/mobile.css?v=57">
</head>
<body data-page="profile">
  <div class="mobile-shell">
    <header class="mobile-topbar">
      <button class="menu-button" type="button" id="menuButton" aria-label="Open menu">☰</button>
      <div class="topbar-title"><strong>Orders & Travel</strong><span>Profile</span></div>
      <button class="icon-button" type="button" id="backButton" aria-label="Back">‹</button>
    </header>
    <aside class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
      <div class="drawer-head"><strong>Menu</strong><button class="icon-button" type="button" id="closeMenuButton" aria-label="Close menu">×</button></div>
      <nav class="drawer-nav">
        <a href="index.html">Dashboard</a>
        <a href="tours.html">Tours</a>
        <a href="receipts.html">Receipts</a>
        <a href="vouchers.html">Voucher Packages</a>
        <a href="profile.html">My Profile</a>
        <a href="users.html" id="drawerUsersLink">User Management</a>
        <a href="../dashboard.html">Desktop View</a>
        <button type="button" id="logoutButton">Logout</button>
      </nav>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <main class="mobile-main">
      <section class="mobile-hero"><h1>Profile</h1><p>View and update your profile in the mobile layout.</p></section>
      <section id="mobileContent" class="mobile-content"><div class="loading-card">Loading Profile v54...</div></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js?v=57"></script>
  <script>
  (function(){
    const content = document.getElementById('mobileContent');
    let client = null;
    let sessionUser = null;
    let profile = null;
    const esc = v => String(v ?? '').replace(/[&<>'\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
    function showError(title, err){ console.error(title, err); content.innerHTML = '<div class="notice"><strong>' + esc(title) + '</strong><br>' + esc(err && err.message ? err.message : err) + '</div>'; }
    function getClient(){ if(client) return client; if(!window.supabase) throw new Error('Supabase library did not load.'); if(!window.USAF_CONFIG) throw new Error('USAF config did not load.'); client = window.supabase.createClient(window.USAF_CONFIG.SUPABASE_URL, window.USAF_CONFIG.SUPABASE_ANON_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }); return client; }
    async function requireAuth(){ const result = await getClient().auth.getSession(); if(!result.data || !result.data.session){ location.href = '../login.html?returnTo=mobile/profile.html'; return null; } sessionUser = result.data.session.user; return sessionUser; }
    function setupShell(){ const drawer = document.getElementById('mobileDrawer'); const backdrop = document.getElementById('drawerBackdrop'); const open = () => { drawer.classList.add('open'); backdrop.classList.add('open'); }; const close = () => { drawer.classList.remove('open'); backdrop.classList.remove('open'); }; document.getElementById('menuButton').addEventListener('click', open); document.getElementById('closeMenuButton').addEventListener('click', close); backdrop.addEventListener('click', close); document.getElementById('backButton').addEventListener('click', () => { if(history.length > 1) history.back(); else location.href = 'index.html'; }); document.getElementById('logoutButton').addEventListener('click', async () => { await getClient().auth.signOut(); location.href = '../login.html'; }); }
    async function loadProfile(){ const result = await getClient().from('USAF_profiles').select('*').eq('id', sessionUser.id).maybeSingle(); if(result.error) throw result.error; profile = result.data || {}; }
    function renderSummary(){
      const isAdmin = (profile.role || 'user') === 'admin' && profile.is_active !== false;
      document.getElementById('drawerUsersLink').style.display = isAdmin ? '' : 'none';
      content.innerHTML = '<article class="data-card"><strong>' + esc(profile.display_name || sessionUser.email) + '</strong><span>' + esc(profile.email || sessionUser.email) + '</span><div class="data-row"><span>Rank</span><b>' + esc(profile.rank || 'Not set') + '</b></div><div class="data-row"><span>Unit</span><b>' + esc(profile.unit || 'Not set') + '</b></div><div class="data-row"><span>Duty Station</span><b>' + esc(profile.duty_station || 'Not set') + '</b></div><div class="data-row"><span>Role</span><b>' + esc(profile.role || 'user') + '</b></div><div class="data-row"><span>Active</span><b>' + (profile.is_active !== false ? 'Yes' : 'No') + '</b></div><button class="btn full" id="openFullProfileBtn">Open Full Profile</button>' + (isAdmin ? '<a class="btn secondary full" href="users.html">Open Mobile User Management</a>' : '') + '</article><div id="profileEditor"></div>';
      document.getElementById('openFullProfileBtn').addEventListener('click', renderEditor);
    }
    function renderEditor(){
      document.getElementById('profileEditor').innerHTML = '<form class="form-card" id="profileForm"><strong>Full Mobile Profile</strong><label>Display Name<input id="display_name" required value="' + esc(profile.display_name || sessionUser.user_metadata?.display_name || sessionUser.email || '') + '"></label><label>Email<input id="email" type="email" required value="' + esc(profile.email || sessionUser.email || '') + '"></label><label>Rank<input id="rank" value="' + esc(profile.rank || '') + '"></label><label>Unit<input id="unit" value="' + esc(profile.unit || '') + '"></label><label>Duty Station<input id="duty_station" value="' + esc(profile.duty_station || '') + '"></label><div class="notice">Role and active status are managed by an Admin.</div><button class="btn full" type="submit">Save Profile</button><button class="btn secondary full" type="button" id="closeProfileForm">Close</button></form><form class="form-card" id="passwordForm"><strong>Update Password</strong><label>New Password<input id="new_password" type="password" autocomplete="new-password" minlength="6"></label><button class="btn secondary full" type="submit">Update Password</button></form>';
      document.getElementById('closeProfileForm').addEventListener('click', () => document.getElementById('profileEditor').innerHTML = '');
      document.getElementById('profileForm').addEventListener('submit', saveProfile);
      document.getElementById('passwordForm').addEventListener('submit', updatePassword);
    }
    async function saveProfile(e){ e.preventDefault(); const newEmail = email.value.trim(); const payload = { id: sessionUser.id, display_name: display_name.value.trim(), email: newEmail, rank: rank.value.trim() || null, unit: unit.value.trim() || null, duty_station: duty_station.value.trim() || null }; const result = await getClient().from('USAF_profiles').upsert(payload); if(result.error) return showError('Profile save failed.', result.error); if(newEmail && newEmail !== sessionUser.email){ const emailResult = await getClient().auth.updateUser({ email:newEmail }); if(emailResult.error) return showError('Profile saved, but email update failed.', emailResult.error); alert('Profile saved. Confirm the email change if Supabase sends a confirmation email.'); } else { alert('Profile saved.'); } await loadProfile(); renderSummary(); }
    async function updatePassword(e){ e.preventDefault(); const value = new_password.value; if(!value) return alert('Enter a new password first.'); const result = await getClient().auth.updateUser({ password:value }); if(result.error) return showError('Password update failed.', result.error); new_password.value = ''; alert('Password updated.'); }
    async function init(){ try { setupShell(); await requireAuth(); if(!sessionUser) return; await loadProfile(); renderSummary(); } catch(err){ showError('Mobile Profile failed to load.', err); } }
    init();
  })();
  </script>
</body>
</html>
