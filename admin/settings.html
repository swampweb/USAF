<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Settings - Orders & Travel Tracker</title>
  <style>
    .settings-page { gap: 18px; }
    .settings-accordion { display: grid; gap: 12px; }
    .settings-section { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 26px rgba(12, 33, 66, .06); overflow: hidden; }
    .settings-section summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; font-weight: 900; }
    .settings-section summary::-webkit-details-marker { display: none; }
    .settings-section summary::after { content: "+"; width: 30px; height: 30px; border-radius: 999px; background: #eef4ff; color: var(--primary); display: inline-grid; place-items: center; font-size: 20px; font-weight: 900; }
    .settings-section[open] summary::after { content: "−"; }
    .settings-section-body { border-top: 1px solid var(--line); padding: 16px 18px 18px; }
    .settings-form-grid { display: grid; grid-template-columns: repeat(2, minmax(220px, 360px)); gap: 14px 18px; align-items: start; }
    .settings-field label { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
    .settings-field input, .settings-field select { max-width: 360px; }
    .settings-info-btn { width: 22px; height: 22px; border: 0; border-radius: 999px; background: #eef4ff; color: var(--primary); font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
    .settings-modal-backdrop { position: fixed; inset: 0; z-index: 2000; background: rgba(2,8,23,.58); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .settings-info-modal { width: min(520px, 100%); background: #fff; border-radius: 22px; border: 1px solid var(--line); box-shadow: 0 24px 80px rgba(2,8,23,.28); padding: 20px; }
    .settings-info-icon { width: 52px; height: 52px; border-radius: 18px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; display: grid; place-items: center; font-size: 24px; margin-bottom: 12px; }
    .settings-info-modal h3 { margin: 0 0 8px; }
    .settings-info-modal p { margin: 0; color: var(--muted); line-height: 1.45; }
    .settings-info-panel { margin-top: 14px; background: #f8fafc; border: 1px solid var(--line); border-radius: 14px; padding: 12px; color: var(--text); font-weight: 700; line-height: 1.4; }
    @media (max-width: 760px) { .settings-form-grid { grid-template-columns: 1fr; } .settings-field input, .settings-field select { max-width: 100%; } }
  </style>
  <link rel="stylesheet" href="../assets/css/styles.css?v=114">
</head>
<body style="visibility:hidden">
  <div id="app">
    <section class="settings-page grid" aria-label="Admin Settings">
      <div class="audit-header-card">
        <div>
          <span class="audit-eyebrow">Admin Control</span>
          <h2>Settings</h2>
          <p>Manage application behavior, footer text, defaults, and audit options without editing code.</p>
        </div>
        <div class="audit-header-actions">
          <button class="btn secondary" type="button" id="reloadSettingsBtn">Reload</button>
          <button class="btn" type="button" id="saveSettingsBtn">Save Settings</button>
        </div>
      </div>

      <div id="settingsMessage" class="message" aria-live="polite"></div>


      <div class="settings-accordion">
        <details class="settings-section">
          <summary><span>General Settings</span></summary>
          <div class="settings-section-body settings-form-grid">
            <div class="settings-field"><label>System Name <button class="settings-info-btn" type="button" data-info-title="System Name" data-info-text="Controls the name shown in the sidebar brand area and other application headings that use the organization name.">i</button></label><input id="settingSystemName" placeholder="Orders & Travel Tracker"></div>
            <div class="settings-field"><label>System Tagline <button class="settings-info-btn" type="button" data-info-title="System Tagline" data-info-text="Controls the short description shown in the top banner under the page title.">i</button></label><input id="settingSystemTagline" placeholder="Track receipts, cycles, vouchers, and reports."></div>
            <div class="settings-field"><label>Maintenance Mode <button class="settings-info-btn" type="button" data-info-title="Maintenance Mode" data-info-text="Future control for temporarily limiting normal user access while the app is being updated or repaired.">i</button></label><select id="settingMaintenanceMode"><option value="false">Off</option><option value="true">On</option></select></div>
            <div class="settings-field"><label>Show App Version <button class="settings-info-btn" type="button" data-info-title="Show App Version" data-info-text="Future control for showing the current app version in the interface or footer.">i</button></label><select id="settingShowVersion"><option value="true">Yes</option><option value="false">No</option></select></div>
          </div>
        </details>

        <details class="settings-section" open>
          <summary><span>Footer Settings</span></summary>
          <div class="settings-section-body settings-form-grid">
            <div class="settings-field"><label>Footer Text <button class="settings-info-btn" type="button" data-info-title="Footer Text" data-info-text="Controls the small text shown at the bottom of the desktop sidebar.">i</button></label><input id="settingFooterText" placeholder="© 2026 CajunVeteran™"></div>
            <div class="settings-field"><label>Show Footer <button class="settings-info-btn" type="button" data-info-title="Show Footer" data-info-text="Turns the desktop sidebar footer text on or off.">i</button></label><select id="settingShowFooter"><option value="true">Yes</option><option value="false">No</option></select></div>
          </div>
        </details>

        <details class="settings-section">
          <summary><span>Tour Settings</span></summary>
          <div class="settings-section-body settings-form-grid">
            <div class="settings-field"><label>Prevent Overlapping Tours <button class="settings-info-btn" type="button" data-info-title="Prevent Overlapping Tours" data-info-text="Controls whether one user can create two active/planned Tours with date ranges that overlap.">i</button></label><select id="settingPreventTourOverlap"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="settings-field"><label>Require Orders Number <button class="settings-info-btn" type="button" data-info-title="Require Orders Number" data-info-text="Future control for making the Orders Number field required before a Tour can be saved.">i</button></label><select id="settingRequireOrdersNumber"><option value="false">No</option><option value="true">Yes</option></select></div>
            <div class="settings-field"><label>Require Location <button class="settings-info-btn" type="button" data-info-title="Require Location" data-info-text="Future control for making the Location field required before a Tour can be saved.">i</button></label><select id="settingRequireLocation"><option value="false">No</option><option value="true">Yes</option></select></div>
            <div class="settings-field"><label>Default Tour Status <button class="settings-info-btn" type="button" data-info-title="Default Tour Status" data-info-text="Future control for deciding whether new Tours start as Active or Planned by default.">i</button></label><select id="settingDefaultTourStatus"><option value="active">Active</option><option value="planned">Planned</option></select></div>
          </div>
        </details>

        <details class="settings-section">
          <summary><span>Cycle Settings</span></summary>
          <div class="settings-section-body settings-form-grid">
            <div class="settings-field"><label>Prevent Overlapping Cycles <button class="settings-info-btn" type="button" data-info-title="Prevent Overlapping Cycles" data-info-text="Controls whether Cycle date ranges can overlap inside travel tracking.">i</button></label><select id="settingPreventCycleOverlap"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="settings-field"><label>Allow Cycle Deletion <button class="settings-info-btn" type="button" data-info-title="Allow Cycle Deletion" data-info-text="Controls whether users can delete Cycles instead of only editing existing Cycles.">i</button></label><select id="settingAllowCycleDelete"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="settings-field"><label>Block Delete When Receipts Exist <button class="settings-info-btn" type="button" data-info-title="Block Delete When Receipts Exist" data-info-text="Prevents deleting a Cycle when receipts are assigned to that Cycle, protecting receipt history from being orphaned.">i</button></label><select id="settingBlockCycleDeleteReceipts"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="settings-field"><label>Require Cycles Inside Tour Dates <button class="settings-info-btn" type="button" data-info-title="Require Cycles Inside Tour Dates" data-info-text="Controls whether Cycle Start and End dates must stay within the selected Tour date range.">i</button></label><select id="settingCycleInsideTour"><option value="true">Yes</option><option value="false">No</option></select></div>
          </div>
        </details>

        <details class="settings-section">
          <summary><span>Receipt Settings</span></summary>
          <div class="settings-section-body settings-form-grid">
            <div class="settings-field"><label>Require Receipt Type <button class="settings-info-btn" type="button" data-info-title="Require Receipt Type" data-info-text="Controls whether users must select a Receipt Type before saving a receipt.">i</button></label><select id="settingRequireReceiptType"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="settings-field"><label>Require Receipt Attachment <button class="settings-info-btn" type="button" data-info-title="Require Receipt Attachment" data-info-text="Future control for requiring a file attachment before a receipt can be saved.">i</button></label><select id="settingRequireReceiptAttachment"><option value="false">No</option><option value="true">Yes</option></select></div>
            <div class="settings-field"><label>Auto Convert Images To PDF <button class="settings-info-btn" type="button" data-info-title="Auto Convert Images To PDF" data-info-text="When enabled, uploaded image receipts such as JPG, PNG, HEIC, or WEBP will be converted to individual PDF files for easier DTS attachment handling.">i</button></label><select id="settingAutoConvertImagesPdf"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="settings-field"><label>Keep Receipts Separate <button class="settings-info-btn" type="button" data-info-title="Keep Receipts Separate" data-info-text="Keeps each uploaded receipt as its own file. If a user uploads 7 images, the system should create 7 separate PDFs instead of one merged PDF.">i</button></label><select id="settingKeepReceiptsSeparate"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="settings-field"><label>Allowed File Types <button class="settings-info-btn" type="button" data-info-title="Allowed File Types" data-info-text="Controls which file extensions can be uploaded as receipt attachments. Recommended: pdf,jpg,jpeg,png,heic,webp.">i</button></label><input id="settingAllowedFileTypes" placeholder="pdf,jpg,jpeg,png,heic,webp"></div>
            <div class="settings-field"><label>Maximum Upload Size MB <button class="settings-info-btn" type="button" data-info-title="Maximum Upload Size" data-info-text="Future control for limiting how large uploaded receipt files can be.">i</button></label><input id="settingMaxUploadMb" type="number" min="1" max="100" step="1"></div>
          </div>
        </details>

        <details class="settings-section">
          <summary><span>Audit Log Settings</span></summary>
          <div class="settings-section-body settings-form-grid">
            <div class="settings-field"><label>Enable Audit Logging <button class="settings-info-btn" type="button" data-info-title="Enable Audit Logging" data-info-text="Controls whether the application should write audit events for tracked actions.">i</button></label><select id="settingAuditEnabled"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="settings-field"><label>Audit Retention <button class="settings-info-btn" type="button" data-info-title="Audit Retention" data-info-text="Controls how long audit log records should be retained before cleanup rules are applied.">i</button></label><select id="settingAuditRetention"><option value="30">30 Days</option><option value="90">90 Days</option><option value="365">365 Days</option><option value="0">Unlimited</option></select></div>
            <div class="settings-field"><label>Log Admin Actions <button class="settings-info-btn" type="button" data-info-title="Log Admin Actions" data-info-text="Controls whether admin activities such as user changes, role changes, and Help Desk handling should be logged.">i</button></label><select id="settingLogAdminActions"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="settings-field"><label>Log User Actions <button class="settings-info-btn" type="button" data-info-title="Log User Actions" data-info-text="Controls whether user activities such as Tours, Cycles, Receipts, and Voucher actions should be logged.">i</button></label><select id="settingLogUserActions"><option value="true">Yes</option><option value="false">No</option></select></div>
          </div>
        </details>
      </div>
    </section>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js?v=114"></script>
  <script src="../assets/js/supabaseClient.js?v=114"></script>
  <script src="../assets/js/auth.js?v=114"></script>
  <script src="../assets/js/layout.js?v=114"></script>
  <script src="../assets/js/settings.js?v=114"></script>
</body>
</html>
