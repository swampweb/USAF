<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Receipt Types</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div id="app"><div class="grid cols-2"><div class="card"><h2>Add Receipt Type</h2><form id="form" class="form-grid"><label>Name<input id="name" required></label><label>Sort Order<input id="sort_order" type="number" value="100"></label><button class="btn">Save Type</button></form></div><div class="card"><h2>Receipt Types</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Active</th><th>Sort</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabaseClient.js"></script><script src="../assets/js/auth.js"></script><script src="../assets/js/layout.js"></script><script>async function load(){const{data}=await window.usafSupabase.from('USAF_receipt_types').select('*').order('sort_order');rows.innerHTML=(data||[]).map(t=>`<tr><td>${t.name}</td><td>${t.is_active?'Yes':'No'}</td><td>${t.sort_order}</td></tr>`).join('')}async function init(){await requireAdmin();await renderLayout('Admin - Receipt Types');await load();form.addEventListener('submit',async e=>{e.preventDefault();const{error}=await window.usafSupabase.from('USAF_receipt_types').insert({name:name.value,sort_order:Number(sort_order.value)});if(error)return alert(error.message);form.reset();await load();})}init();</script></body></html>
