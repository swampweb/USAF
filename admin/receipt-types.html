<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Receipt Types</title><link rel="stylesheet" href="../assets/css/styles.css?v=8"></head><body style="visibility:hidden"><div id="app">
<div class="grid cols-2">
  <div class="card">
    <h2 id="formTitle">Add Receipt Type</h2>
    <p class="muted">Choose where this type should be available: Per Diem, Other Receipts, or both.</p>
    <form id="typeForm" class="compact-form" style="margin-top:14px">
      <input type="hidden" id="type_id_edit">
      <label class="span-2">Name<input id="type_name" required placeholder="Example: Grocery"></label>
      <label>Sort Order<input id="type_sort_order" type="number" value="100" required></label>
      <label>Active<select id="type_is_active"><option value="true">Yes</option><option value="false">No</option></select></label>
      <div class="span-2 checkbox-panel">
        <div class="checkbox-row"><input id="applies_per_diem" type="checkbox" checked><label for="applies_per_diem">Show for Per Diem receipts</label></div>
        <div class="checkbox-row"><input id="applies_other" type="checkbox" checked><label for="applies_other">Show for Other receipts</label></div>
      </div>
      <div class="actions span-2"><button class="btn" id="saveBtn">Save Type</button><button class="btn secondary" type="button" id="cancelEditBtn">Cancel Edit</button></div>
    </form>
  </div>
  <div class="card">
    <h2>Receipt Types</h2>
    <p class="muted">Edit existing types instead of creating duplicates.</p>
    <div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Name</th><th>Used For</th><th>Active</th><th>Sort</th><th>Actions</th></tr></thead><tbody id="typeRows"></tbody></table></div>
  </div>
</div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js?v=8"></script><script src="../assets/js/supabaseClient.js?v=8"></script><script src="../assets/js/auth.js?v=8"></script><script src="../assets/js/layout.js?v=8"></script><script src="../assets/js/receipt-types-admin.js?v=8"></script></body></html>
