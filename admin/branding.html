<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Branding</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div id="app"><div class="card"><h2>Branding / Appearance</h2><form id="form" class="form-grid"><label>Organization Name<input id="organization_name"></label><label>Primary Color<input id="primary_color" type="color"></label><label>Secondary Color<input id="secondary_color" type="color"></label><label>Accent Color<input id="accent_color" type="color"></label><label>Dashboard Banner Path<input id="dashboard_banner_path" placeholder="Optional Supabase storage path or image URL"></label><label>Login Background Path<input id="login_background_path" placeholder="Optional Supabase storage path or image URL"></label><button class="btn">Save Branding</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabaseClient.js"></script><script src="../assets/js/auth.js"></script><script src="../assets/js/layout.js"></script><script>async function init(){await requireAdmin();await renderLayout('Admin - Branding');const{data}=await window.usafSupabase.from('USAF_settings').select('*').eq('id',true).single();for(const k of ['organization_name','primary_color','secondary_color','accent_color','dashboard_banner_path','login_background_path']){if(document.getElementById(k))document.getElementById(k).value=data?.[k]||''}form.addEventListener('submit',async e=>{e.preventDefault();const payload={organization_name:organization_name.value,primary_color:primary_color.value,secondary_color:secondary_color.value,accent_color:accent_color.value,dashboard_banner_path:dashboard_banner_path.value||null,login_background_path:login_background_path.value||null};const{error}=await window.usafSupabase.from('USAF_settings').update(payload).eq('id',true);if(error)return alert(error.message);alert('Branding saved.');})}init();</script></body></html>
