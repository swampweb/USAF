<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Audit Log</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body><div id="app"><div class="card"><h2>Audit Log</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>User</th><th>Action</th><th>Entity</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabaseClient.js"></script><script src="../assets/js/auth.js"></script><script src="../assets/js/layout.js"></script><script>async function init(){await requireAdmin();await renderLayout('Admin - Audit Log');const{data}=await window.usafSupabase.from('USAF_audit_log').select('*').order('created_at',{ascending:false});rows.innerHTML=(data||[]).map(a=>`<tr><td>${new Date(a.created_at).toLocaleString()}</td><td>${a.user_id||''}</td><td>${a.action}</td><td>${a.entity_name||''}</td></tr>`).join('')||'<tr><td colspan="4">No audit records yet.</td></tr>'}init();</script></body></html>
