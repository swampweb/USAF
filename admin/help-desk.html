<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Help Desk - USAF Travel Tracker</title>
  <link rel="stylesheet" href="../styles.css?v=90">
  <link rel="stylesheet" href="../assets/css/styles.css?v=90">
  <link rel="stylesheet" href="../assets/css/helpdesk.css?v=90">
  <style>
    :root { --primary:#00308f; --secondary:#0a2342; --accent:#c0c0c0; --line:#dbe5f0; --muted:#64748b; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, Helvetica, sans-serif; background:#f3f6fb; color:#0f172a; }
    #app { min-height:100vh; display:grid; grid-template-columns:280px minmax(0,1fr); }
    .sidebar { background:linear-gradient(180deg,var(--secondary),#06152a); color:#fff; padding:18px 14px; display:flex; flex-direction:column; gap:16px; min-height:100vh; position:sticky; top:0; }
    .brand { display:flex; align-items:center; gap:12px; padding:6px 8px 16px; border-bottom:1px solid rgba(255,255,255,.15); }
    .logo-mark { width:58px; height:58px; min-width:58px; border-radius:14px; display:grid; place-items:center; overflow:hidden; background:rgba(255,255,255,.12); }
    .logo-mark img, .brand img { max-width:100% !important; max-height:100% !important; width:100% !important; height:100% !important; object-fit:contain !important; display:block; }
    .brand-title { font-weight:900; font-size:15px; line-height:1.15; }
    .brand-subtitle { font-size:11px; color:#cbd5e1; margin-top:4px; }
    .sidebar nav { display:flex; flex-direction:column; gap:6px; }
    .nav-section-title { margin:14px 10px 6px; font-size:11px; font-weight:900; text-transform:uppercase; color:#cbd5e1; letter-spacing:.12em; }
    .nav-link { min-height:42px; display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; color:#e5edf8; text-decoration:none; font-weight:800; font-size:14px; }
    .nav-link:hover, .nav-link.active { background:rgba(255,255,255,.14); color:#fff; }
    .nav-link svg { width:20px !important; height:20px !important; min-width:20px !important; max-width:20px !important; max-height:20px !important; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .nav-badge { margin-left:auto; min-width:20px; height:20px; border-radius:999px; background:#dc2626; color:#fff; font-size:12px; display:inline-flex; align-items:center; justify-content:center; padding:0 6px; }
    .sidebar-footer { margin-top:auto; font-size:12px; color:#cbd5e1; padding:12px 10px; border-top:1px solid rgba(255,255,255,.12); }
    .main { min-width:0; display:flex; flex-direction:column; }
    .topbar { margin:18px; border-radius:22px; padding:22px; min-height:126px; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:18px; background-size:cover; background-position:center; box-shadow:0 18px 45px rgba(15,23,42,.16); }
    .topbar h1 { margin:0; font-size:30px; line-height:1.1; }
    .topbar p { margin:6px 0 0; color:#dbeafe; }
    .user-chip { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:8px 10px 8px 14px; }
    .user-chip span { font-weight:900; }
    .user-chip small { color:#dbeafe; text-transform:capitalize; }
    .user-chip button, .btn { border:0; border-radius:999px; padding:9px 13px; background:var(--primary); color:white; font-weight:900; cursor:pointer; }
    .user-chip button { background:#fff; color:var(--primary); }
    .page-content { padding:0 18px 28px; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:16px; }
    h2, h3 { margin:0 0 8px; }
    .muted { color:var(--muted); margin:0; }
    .grid.cols-2, .helpdesk-admin-grid { display:grid; grid-template-columns:minmax(280px,420px) minmax(0,1fr); gap:16px; align-items:start; }
    .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:0 10px 30px rgba(15,23,42,.07); }
    img, svg { max-width:100%; }
    @media (max-width:900px) { #app { grid-template-columns:1fr; } .sidebar { position:relative; min-height:auto; } .topbar { flex-direction:column; align-items:flex-start; } .grid.cols-2, .helpdesk-admin-grid { grid-template-columns:1fr; } }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabaseClient.js"></script>
  <script src="../auth.js"></script>
  <script src="../layout.js"></script>
</head>
<body style="visibility:hidden">
  <div id="app">
    <div class="toolbar">
      <div>
        <h2>Question / Issue Help Desk</h2>
        <p class="muted">Review User and Report role tickets. The count clears after Admin opens, replies, or resolves the ticket.</p>
      </div>
      <button class="btn" id="refreshHelpDeskBtn">Refresh</button>
    </div>
    <div class="grid cols-2 helpdesk-admin-grid">
      <section class="card">
        <h3>Tickets</h3>
        <div id="helpdeskTicketList" class="helpdesk-list"></div>
      </section>
      <section class="card">
        <h3>Ticket Detail</h3>
        <div id="helpdeskTicketDetail"></div>
      </section>
    </div>
  </div>
  <script src="../assets/js/helpdesk-admin.js?v=90"></script>
</body>
</html>
