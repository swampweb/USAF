<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Users | Orders & Travel Tracker</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="shortcut icon" href="../favicon.ico">
  <link rel="apple-touch-icon" href="../assets/img/orders-travel-tracker-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="stylesheet" href="../assets/css/styles.css?v=78">
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <section class="hero"><h1>Admin - Users</h1><p>Manage users, roles, active status, and read-only user view.</p></section>
      <section class="content-grid two-col">
        <div class="card">
          <h2>Users</h2>
          <p class="muted">Select a user to edit profile, role, active status, or view records in read-only mode.</p>
          <label>Filter
            <select id="userFilter">
              <option value="all">All</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="admin">Admins</option>
              <option value="report">Report</option>
              <option value="user">Users</option>
            </select>
          </label>
          <div id="userCards" class="stacked-list" style="margin-top:14px"><div class="empty-state">Loading users...</div></div>
        </div>
        <div class="card" id="userEditor">
          <h2>Edit User</h2>
          <p class="muted">Select a user from the list to edit or view as that user.</p>
        </div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/config.js?v=78"></script>
  <script src="../assets/js/supabaseClient.js?v=78"></script>
  <script src="../assets/js/auth.js?v=78"></script>
  <script src="../assets/js/effective-user.js?v=78"></script>
  <script src="../assets/js/layout.js?v=78"></script>
  <script src="../assets/js/admin-users.js?v=78"></script>
</body>
</html>
