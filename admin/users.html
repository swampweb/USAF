<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Users</title><link rel="stylesheet" href="../assets/css/styles.css?v=5"></head><body style="visibility:hidden"><div id="app"><div class="card"><h2>Users</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js?v=5"></script><script src="../assets/js/supabaseClient.js?v=5"></script><script src="../assets/js/auth.js?v=5"></script><script src="../assets/js/layout.js?v=5"></script><script>async function init(){await requireAdmin();await renderLayout('Admin - Users');const {data}=await window.usafSupabase.from('USAF_profiles').select('*').order('created_at');rows.innerHTML=(data||[]).map(u=>`<tr><td>${u.display_name||''}</td><td>${u.email||''}</td><td><span class="badge">${u.role}</span></td><td>${u.is_active?'Yes':'No'}</td></tr>`).join('')}init();</script></body></html>
