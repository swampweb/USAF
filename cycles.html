<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cycles | USAF Travel Tracker</title><link rel="stylesheet" href="assets/css/styles.css?v=6"></head><body style="visibility:hidden"><div id="app">
<div class="grid cols-2"><div class="card"><h2>Add Cycle</h2><p>Cycles must be inside the selected Tour order date range.</p><form id="cycleForm" class="form-grid"><label>Tour<select id="tour_id" required></select></label><label>Start Date<input id="start_date" type="date" required></label><label>End Date<input id="end_date" type="date" required></label><label>Per Diem Per Day<input id="per_diem_per_day" type="number" step="0.01" required></label><label>Status<select id="status"><option value="active">Active</option><option value="draft">Draft</option><option value="closed">Closed</option></select></label><label>Notes<textarea id="notes"></textarea></label><button class="btn">Save Cycle</button></form></div><div class="card"><h2>Cycles</h2><div class="table-wrap"><table><thead><tr><th>Tour</th><th>Start</th><th>End</th><th>Per Day</th><th>Total</th><th>Status</th></tr></thead><tbody id="cycleRows"></tbody></table></div></div></div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js?v=6"></script><script src="assets/js/supabaseClient.js?v=6"></script><script src="assets/js/auth.js?v=6"></script><script src="assets/js/layout.js?v=6"></script><script src="assets/js/cycles.js?v=6"></script></body></html>
