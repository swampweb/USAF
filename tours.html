<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tours | USAF Travel Tracker</title><link rel="stylesheet" href="assets/css/styles.css?v=57"></head><body style="visibility:hidden"><div id="app">
<div class="tours-workspace">
  <div class="card">
    <div class="tour-list-header">
      <div><h2>Existing Tours</h2><p class="muted">Select a Tour to edit details and manage cycles.</p></div>
      <label>Filter<select id="tourFilter"><option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option></select></label>
    </div>
    <div class="actions" style="margin-bottom:14px"><button class="btn" id="newTourBtn">Create New Tour</button></div>
    <div id="tourCards" class="tour-card-list"></div>
  </div>

  <div id="tourDetailWrap">
    <div class="tour-detail-empty"><div><h2>Select a Tour</h2><p>Pick an existing Tour from the list, or create a new one. Tour details and cycles will open here.</p></div></div>
  </div>
</div>

<div class="modal-backdrop" id="tourModal">
  <div class="modal-card">
    <div class="modal-head"><h2 id="tourModalTitle">Create Tour</h2><button class="icon-close" id="closeTourModal" type="button">X</button></div>
    <div class="modal-body">
      <form id="tourForm" class="compact-form">
        <input type="hidden" id="tour_id_edit">
        <label class="span-2">Tour Name<input id="tour_name" required placeholder="Example: HAZMAT Inspector Refresher"></label>
        <label>Location<input id="location_name" placeholder="Example: Sheppard AFB"></label>
        <label>Orders Number<input id="orders_number" placeholder="Optional"></label>
        <label>Start Date<input id="orders_start_date" type="date" required></label>
        <label>End Date<input id="orders_end_date" type="date" required></label>
        <label>Status<select id="status"><option value="active">Active</option><option value="planned">Planned</option><option value="completed">Completed</option><option value="cancelled">Inactive / Cancelled</option></select></label>
        <label class="span-2">Notes<textarea id="notes"></textarea></label>
        <div class="actions span-2"><button class="btn" id="saveTourBtn">Save Tour</button><button class="btn secondary" type="button" id="cancelTourBtn">Cancel</button></div>
      </form>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="cycleModal">
  <div class="modal-card">
    <div class="modal-head"><h2 id="cycleModalTitle">Add Cycle</h2><button class="icon-close" id="closeCycleModal" type="button">X</button></div>
    <div class="modal-body">
      <form id="cycleForm" class="compact-form">
        <input type="hidden" id="selected_tour_id">
        <input type="hidden" id="cycle_id_edit">
        <label>Cycle Start<input id="cycle_start_date" type="date" required></label>
        <label>Cycle End<input id="cycle_end_date" type="date" required></label>
        <label>Per Diem / Day<input id="cycle_per_diem_per_day" type="number" step="0.01" required></label>
        <label>Status<select id="cycle_status"><option value="active">Active</option><option value="draft">Draft</option><option value="closed">Closed</option><option value="cancelled">Inactive / Cancelled</option></select></label>
        <label class="span-2">Cycle Notes<textarea id="cycle_notes"></textarea></label>
        <div class="actions span-2"><button class="btn" id="saveCycleBtn">Save Cycle</button><button class="btn secondary" type="button" id="cancelCycleBtn">Cancel</button></div>
      </form>
    </div>
  </div>
</div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js?v=57"></script><script src="assets/js/supabaseClient.js?v=57"></script><script src="assets/js/auth.js?v=57"></script><script src="assets/js/layout.js?v=57"></script><script src="assets/js/tours.js?v=57"></script></body></html>
