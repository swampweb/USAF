<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | USAF Travel Tracker</title><link rel="stylesheet" href="assets/css/styles.css"></head>
<body><div id="app">
  <div class="grid cols-4">
    <div class="card stat"><div class="stat-icon">C</div><div><div class="stat-label">Current Cycle</div><div id="cycleName" class="stat-value">Loading...</div></div></div>
    <div class="card stat"><div class="stat-icon">$</div><div><div class="stat-label">Total Per Diem</div><div id="totalPerDiem" class="stat-value">$0.00</div></div></div>
    <div class="card stat"><div class="stat-icon" style="background:#b42318">R</div><div><div class="stat-label">Total Spent</div><div id="totalSpent" class="stat-value">$0.00</div></div></div>
    <div class="card stat"><div class="stat-icon" style="background:#067647">L</div><div><div class="stat-label">Total Remaining</div><div id="totalRemaining" class="stat-value">$0.00</div></div></div>
  </div>
  <div class="grid cols-2" style="margin-top:18px">
    <div class="card"><h2>Calendar View</h2><div id="calendar" class="calendar"></div></div>
    <div class="card"><h2>Daily Summary</h2><div class="table-wrap"><table><thead><tr><th>Date</th><th>Per Diem</th><th>Spent</th><th>Remaining</th></tr></thead><tbody id="dailySummary"></tbody></table></div></div>
  </div>
  <div class="card" style="margin-top:18px"><h2>Today's Per Diem Receipts</h2><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Type</th><th>Date</th><th>Amount</th></tr></thead><tbody id="todayReceipts"></tbody></table></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="assets/js/supabaseClient.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/layout.js"></script><script src="assets/js/dashboard.js"></script></body></html>
